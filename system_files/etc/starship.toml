"$schema" = 'https://starship.rs/config-schema.json'
# Prompt do WatermelonOS. Para personalizar, copie para ~/.config/starship.toml

add_newline = true
format = """
$directory${env_var.MELON_ENV_DEV}${env_var.MELON_ENV_PROD}$git_branch$git_state$git_status$nodejs$bun$deno$python$golang$rust$java$kotlin$dart$php$ruby$docker_context$kubernetes$cmd_duration
$character"""

[directory]
style = "bold #7dd3a0"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold #ff5468"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f2c56b"
format = '([$all_status$ahead_behind]($style) )'

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "

[bun]
format = "[$symbol($version)]($style) "

[deno]
format = "[$symbol($version)]($style) "

[python]
symbol = " "
format = '[$symbol$pyenv_prefix($version)( \($virtualenv\))]($style) '

[golang]
symbol = " "
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
format = "[$symbol($version)]($style) "

[java]
symbol = " "
format = "[$symbol($version)]($style) "

[kotlin]
format = "[$symbol($version)]($style) "

[dart]
format = "[$symbol($version)]($style) "

[php]
format = "[$symbol($version)]($style) "

[ruby]
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
symbol = "󱃾 "
format = '[$symbol$context( \($namespace\))]($style) '

[cmd_duration]
min_time = 2000
style = "#8e8e93"
format = "[󱦟 $duration]($style) "

[character]
success_symbol = "[❯](bold #7dd3a0)"
error_symbol = "[❯](bold #ff5468)"
vimcmd_symbol = "[❮](bold #7dd3a0)"

# Cofre de envs (melon env): mostra o modo do projeto
[env_var.MELON_ENV_DEV]
variable = "MELON_ENV_DEV"
format = "[🔐 dev]($style) "
style = "bold #7dd3a0"

[env_var.MELON_ENV_PROD]
variable = "MELON_ENV_PROD"
format = "[🔐 PROD]($style) "
style = "bold #ff5468"
